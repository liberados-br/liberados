name: Testes

# Roda a suite a cada push e pull request.
#
# Os testes nao tocam a rede nem um banco de verdade: funcoes puras, casos de
# uso com adaptador falso e um SQLite temporario. Nao precisam de segredo,
# rodam em segundos e podem rodar em fork sem risco de disparar consulta ao
# Registro.br. O projeto e so biblioteca padrao: nao ha passo de instalacao.
#
# Um job roda as duas versoes em sequencia: 3.10, o piso (o codigo usa
# `str | None` em anotacao avaliada), e 3.13, a corrente.

on:
  push:
    branches: [main]
    paths-ignore:
      - "*.md"
      - "docs/**/*.md"
  pull_request:
    paths-ignore:
      - "*.md"
      - "docs/**/*.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: testes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: |
            3.10
            3.13

      - name: Testes (3.10 e 3.13)
        run: |
          python3.10 -m unittest -q test_scripts.py
          python3.13 -m unittest -q test_scripts.py

      - name: Os scripts de entrada abrem sem erro (3.10 e 3.13)
        # --help exercita import e argparse de cada entrada: pega import
        # quebrado que a suite nao ve.
        run: |
          # exportar_site.py fica de fora: ele nao usa argparse, entao
          # "--help" executaria a exportacao.
          for py in python3.10 python3.13; do
            for script in check_dominios.py flag_marcas.py filtrar_lista.py \
                          varrer.py desfecho.py historias.py demanda_cnpj.py; do
              echo "--- $py $script"
              "$py" "$script" --help > /dev/null
            done
          done

      - name: Nenhum teste toca a rede
        # Um teste que sai para a internet deixa a suite lenta e intermitente.
        run: |
          # exige o parentese: interessa a CHAMADA, nao a palavra. Citar
          # "socket.getaddrinfo" dentro de um mock ou de uma docstring nao
          # pode reprovar.
          if grep -nE '(urlopen|getaddrinfo|requests\.get)\(' test_scripts.py \
             | grep -v 'mock'; then
            echo "::error::teste tocando a rede sem mock" && exit 1
          fi
          echo "ok"
