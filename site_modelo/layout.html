<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
<title>{{titulo}}</title>
<meta name="description" content="{{descricao}}">
{{robots}}
<link rel="canonical" href="{{canonical}}">
<meta property="og:type" content="{{og_tipo}}">
<meta property="og:site_name" content="{{nome}}">
<meta property="og:title" content="{{titulo}}">
<meta property="og:description" content="{{descricao}}">
<meta property="og:url" content="{{canonical}}">
<meta property="og:locale" content="pt_BR">
<meta property="og:image" content="{{imagem}}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
{{og_extra}}
{{alternativo}}
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-48.png" sizes="48x48">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<script>
/* Roda antes de qualquer pintura: aplicar o tema depois causaria um flash
   do tema errado. Por isso e inline, e por isso a CSP leva o hash deste
   bloco, calculado no build. O texto tem de ser identico em toda pagina:
   e um hash so para o site inteiro. */
(function () {
  try {
    var t = localStorage.getItem("tema");
    if (t === "claro" || t === "escuro") {
      document.documentElement.setAttribute("data-tema", t);
    }
  } catch (e) { /* navegacao anonima bloqueia o storage; segue no sistema */ }
})();
</script>
<!-- A fonte do site (Archivo, SIL OFL) vem do proprio dominio: sem ela o
     titulo repinta depois do CSS. So a faixa latina, que cobre o
     portugues; a latin-ext so baixa se a pagina precisar. -->
<link rel="preload" href="/fontes/archivo-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/style.css">
{{jsonld}}
</head>
<body>

<a class="pular" href="#conteudo">Pular para o conteúdo</a>

<header>
  <a class="marca-nome" href="/">{{nome}}</a>
  <nav class="abas" aria-label="Seções">
    {{nav}}
  </nav>
  <div class="cabecalho-acoes">
    {{cabecalho_extra}}
    <button id="btn-tema" class="tema" type="button" aria-label="Tema">
      <svg class="icone-sistema" viewBox="0 0 24 24" aria-hidden="true">
        <rect x="2" y="4" width="20" height="14" rx="2"/>
        <path d="M8 21h8M12 18v3"/>
      </svg>
      <svg class="icone-claro" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="4.2"/>
        <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
      </svg>
      <svg class="icone-escuro" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M20 14.5A8.2 8.2 0 0 1 9.5 4a8.3 8.3 0 1 0 10.5 10.5z"/>
      </svg>
    </button>
  </div>
  {{regua}}
</header>

<main id="conteudo" tabindex="-1" class="{{classe_main}}">
{{miolo}}
</main>

<footer>
  {{rodape}}
</footer>

<script src="/tema.js"></script>
{{scripts}}
</body>
</html>
