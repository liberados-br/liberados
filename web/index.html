<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Garimpo .br</title>
<meta name="description" content="Garimpo de domínios .br no processo de liberação do Registro.br: situação e número de candidatos de cada nome.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%E2%9B%8F%3C/text%3E%3C/svg%3E">
<script>
/* Roda antes de qualquer pintura: aplicar o tema depois causaria um flash
   do tema errado. Por isso e inline, e por isso a CSP leva o hash deste
   bloco, calculado no build. */
(function () {
  try {
    var t = localStorage.getItem("tema");
    if (t === "claro" || t === "escuro") {
      document.documentElement.setAttribute("data-tema", t);
    }
  } catch (e) { /* navegacao anonima bloqueia o storage; segue no sistema */ }
})();
</script>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<header>
  <h1>Garimpo <span class="br">.br</span></h1>
  <div class="cabecalho-acoes">
    <span id="carimbo" class="carimbo"></span>
    <span id="prazo" class="prazo escondido"></span>
    <button id="btn-tema" class="tema" type="button" aria-label="Tema">
      <svg class="icone-sistema" viewBox="0 0 24 24" aria-hidden="true">
        <rect x="2" y="4" width="20" height="14" rx="2"/>
        <path d="M8 21h8M12 18v3"/>
      </svg>
      <svg class="icone-claro" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="4.2"/>
        <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
      </svg>
      <svg class="icone-escuro" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M20 14.5A8.2 8.2 0 0 1 9.5 4a8.3 8.3 0 1 0 10.5 10.5z"/>
      </svg>
    </button>
    <button id="btn-importar" type="button">Baixar listas oficiais</button>
    <button id="btn-parar" type="button" class="perigo escondido">Parar</button>
  </div>

  <!-- A rodada e uma janela de 7 dias; a regua preenche conforme o prazo
       corre. Colada na base do cabecalho, nao ocupa altura. -->
  <div id="regua" class="regua" role="img" aria-label="Carregando a rodada">
    <span></span>
  </div>
</header>

<!-- aria-live: o progresso muda sozinho e precisa ser anunciado -->
<div id="progresso" class="progresso escondido" role="status" aria-live="polite">
  <div class="barra">
    <div id="barra-preenche" role="progressbar"
         aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"></div>
  </div>
  <p class="progresso-texto">
    <strong id="progresso-msg"></strong>
    <span id="progresso-detalhe"></span>
  </p>
</div>

<main>

  <section id="painel" aria-label="Resumo por situação">
    <div class="cartoes" role="group" aria-label="Filtros rápidos">
      <button class="cartao destaque" type="button" data-filtro="joias" aria-pressed="true">
        <span class="numero" id="n-joias">-</span>
        <span class="titulo">Joias</span>
        <span class="ajuda">Elegível ao leilão e sem candidato visível</span>
      </button>
      <button class="cartao bom" type="button" data-filtro="sem_competicao" aria-pressed="false">
        <span class="numero" id="n-sem_competicao">-</span>
        <span class="titulo">Sem competição</span>
        <span class="ajuda">Nenhum candidato visível: zero ou um</span>
      </button>
      <button class="cartao alerta" type="button" data-filtro="disputados" aria-pressed="false">
        <span class="numero" id="n-disputados">-</span>
        <span class="titulo">Disputados</span>
        <span class="ajuda">Já tem candidato, tende a travar</span>
      </button>
      <button class="cartao leilao" type="button" data-filtro="leilao" aria-pressed="false">
        <span class="numero" id="n-leilao">-</span>
        <span class="titulo">Em leilão</span>
        <span class="ajuda">Processo competitivo aberto</span>
      </button>
      <button class="cartao" type="button" data-filtro="marcados" aria-pressed="false">
        <span class="numero" id="n-marcados">-</span>
        <span class="titulo">Marcados</span>
        <span class="ajuda">Sua lista de acompanhamento</span>
      </button>
      <button class="cartao livre escondido" type="button" data-filtro="livres"
              aria-pressed="false">
        <span class="numero" id="n-livres">-</span>
        <span class="titulo">Livre agora</span>
        <span class="ajuda">Ficou livre: quem registrar primeiro leva, sem esperar rodada</span>
      </button>
      <button class="cartao neutro" type="button" data-filtro="nao_verificados" aria-pressed="false">
        <span class="numero" id="n-nao_verificados">-</span>
        <span class="titulo">Não verificados</span>
        <span class="ajuda">Ainda sem consulta ao Registro.br</span>
      </button>
    </div>
    <p class="rodape-painel" id="rodape-painel"></p>
  </section>

  <section id="controles" aria-label="Filtros e ações">
    <div class="linha">
      <label class="sr-apenas" for="busca">Buscar domínio</label>
      <input type="search" id="busca" placeholder="Buscar domínio..."
             autocomplete="off" spellcheck="false">

      <label class="sr-apenas" for="ordem">Ordenar por</label>
      <select id="ordem">
        <option value="nota">Ordenar por relevância</option>
        <option value="menos_candidatos">Menos candidatos primeiro</option>
        <option value="candidatos">Mais candidatos primeiro</option>
        <option value="tamanho">Nome mais curto</option>
        <option value="recentes">Verificado mais recente</option>
        <option value="alfabetica">Alfabetica, A a Z</option>
        <option value="alfabetica_desc">Alfabetica, Z a A</option>
      </select>

      <label class="checkbox" for="esconder-risco">
        <input type="checkbox" id="esconder-risco" checked>
        Esconder risco de marca
      </label>

      <span class="espacador"></span>
      <button id="btn-verificar-visiveis" type="button" class="primario">
        Atualizar os que estou vendo
      </button>
      <a id="link-exportar" class="botao-link" href="#" download>Exportar CSV</a>
    </div>

    <div class="linha secundaria">
      <h2 id="titulo-lista" class="titulo-lista"></h2>
      <button type="button" class="alternador-com" data-pontocom-alternar aria-pressed="false"
              title="Confere, no seu navegador, se o mesmo nome em .com tem dono">Mostrar o .com</button>
      <span class="espacador"></span>
      <details class="avancado">
        <summary>Avancado</summary>
        <div class="painel-avancado">
          <label for="delay">Pausa entre consultas, em segundos</label>
          <input type="number" id="delay" value="2" min="2" max="10" step="0.5"
                 inputmode="decimal">

          <label for="limite-verificar">Verificar no máximo</label>
          <input type="number" id="limite-verificar" value="200" min="1" max="1000"
                 inputmode="numeric">

          <button id="btn-verificar-filtro" type="button">
            Verificar todos deste filtro
          </button>

          <hr>

          <label for="novos-dominios">Adicionar domínios a mão, um por linha</label>
          <textarea id="novos-dominios" rows="3" placeholder="exemplo.com.br"
                    spellcheck="false"></textarea>
          <button id="btn-adicionar" type="button">Adicionar</button>
        </div>
      </details>
    </div>
    <p class="pontocom-status" data-pontocom-status role="status"></p>
  </section>

  <section id="novidades" class="novidades escondido" aria-live="polite">
    <h2>Mudou desde a última verificação</h2>
    <ul id="lista-novidades"></ul>
  </section>

  <section id="resultados" aria-label="Domínios">
    <div class="rolagem">
      <!-- os role= explícitos preservam a semantica de tabela quando o CSS
           troca o display para lista no celular -->
      <table id="tabela" role="table">
        <thead>
          <tr role="row">
            <th class="col-marca" scope="col"><span class="sr-apenas">Marcar</span></th>
            <th scope="col">Domínio</th>
            <th scope="col">Situação</th>
            <th class="num" scope="col">Competindo</th>
            <th class="num" scope="col">Relevância</th>
            <th scope="col">Por que</th>
            <th scope="col"><span class="sr-apenas">Ações</span></th>
          </tr>
        </thead>
        <tbody id="corpo-tabela"></tbody>
      </table>
    </div>
    <p id="vazio" class="vazio escondido"></p>
    <nav class="paginacao" aria-label="Paginação">
      <button id="btn-anterior" type="button">Anterior</button>
      <span id="info-pagina" aria-live="polite"></span>
      <button id="btn-proxima" type="button">Próxima</button>
    </nav>
  </section>

</main>

<script src="/static/disputa.js"></script>
<script src="/static/pontocom.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
